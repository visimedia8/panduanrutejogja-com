      <text x="16" y="28" fill="#d4af37" font-size="11" font-weight="bold" font-family="monospace">TOTAL STASIUN</text>
      <text x="16" y="56" fill="#ffffff" font-size="20" font-weight="900" font-family="monospace">13 Titik</text>
    </g>
  
    <g transform="translate(345, 280)">
      <rect width="245" height="72" rx="10" fill="#09231c" stroke="#d4af37" stroke-width="1.2" opacity="0.9" />
      <text x="16" y="28" fill="#d4af37" font-size="11" font-weight="bold" font-family="monospace">TARIF FLAT</text>
