      <text x="32" y="16" fill="#e2e8f0" font-size="15" font-family="sans-serif" font-weight="500">Wilayah Sukoharjo: Stasiun Gawok (Pemberhentian Komuter Komersial)</text>
    </g>
  
    <g transform="translate(80, 556)">
