    <text x="0" y="60" fill="#cbd5e1" font-size="16" font-family="sans-serif" font-weight="normal">Tarif Flat Subsidi Rp8.000 Sekali Jalan — Waktu Tempuh Rata-Rata 75–80 Menit</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="240" x2="1120" y2="240" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3" />

