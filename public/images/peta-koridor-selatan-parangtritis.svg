    <text x="0" y="60" fill="#cbd5e1" font-size="16" font-family="sans-serif" font-weight="normal">Trans Jogja 3A/4A ke Giwangan ➔ Bus DAMRI Perintis via Jalan Parangtritis (Jl. Paris)</text>
  </g>

