      <text x="16" y="28" fill="#d4af37" font-size="11" font-weight="bold" font-family="monospace">WAKTU TEMPUH</text>
      <text x="16" y="56" fill="#ffffff" font-size="20" font-weight="900" font-family="monospace">50–60 Mnt</text>
    </g>
  

  <!-- Feature List Items -->
  
    <g transform="translate(80, 380)">
      <circle cx="12" cy="12" r="7" fill="#059669" stroke="#ffffff" stroke-width="2" />
