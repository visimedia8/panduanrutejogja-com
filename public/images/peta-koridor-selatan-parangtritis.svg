      <text x="32" y="16" fill="#e2e8f0" font-size="15" font-family="sans-serif" font-weight="500">Tahap 4: Perjalanan menyusuri Jl. Parangtritis (Jl. Paris) melintasi Sewon, Bantul, dan Kretek</text>
    </g>
  
    <g transform="translate(80, 556)">
